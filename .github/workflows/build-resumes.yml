name: Build bilingual resumes
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_resumes.py'
      - '.github/workflows/build-resumes.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab==4.4.4
      - run: python tools/build_resumes.py
      - name: Commit resumes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Joao_Victor_Curriculo_PT.pdf Joao_Victor_Resume_EN.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build bilingual resumes"
          git push origin HEAD:main
