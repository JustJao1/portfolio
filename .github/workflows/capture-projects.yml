name: Capture project screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/capture_projects.py'
      - '.github/workflows/capture-projects.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/capture_projects.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-project-screenshots
          path: screenshots/
  publish:
    needs: capture
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: public-project-screenshots
          path: screenshots
      - name: Commit captured images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture public project interfaces"
          git push origin HEAD:main
