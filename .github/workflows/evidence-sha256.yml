name: Evidence SHA-256 (public snapshots)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evidence-sha256.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hash:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve public repository and hash pinned snapshots
        run: |
          set -eu
          git clone --quiet --depth=1 --branch main https://github.com/JustJao1/portfolio.git evidence-work
          cd evidence-work
          python3 tools/evidence_full.py --out evidencias/2026-11-26
      - name: Commit manifests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd evidence-work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidencias/2026-11-26/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record full SHA-256 file manifests for preserved snapshots'
          gh auth setup-git
          git push origin HEAD:main
