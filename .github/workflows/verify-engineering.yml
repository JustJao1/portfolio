name: Verify portfolio evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_engineering.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --prefix tools/browser --no-audit --no-fund
      - run: npx --prefix tools/browser playwright install --with-deps chromium
      - run: npm --prefix tools/browser test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-results
          path: quality-results/
          if-no-files-found: warn
          retention-days: 30
