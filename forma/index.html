body.chat-mode{height:100vh;height:var(--chat-height,100dvh);overflow:hidden;overscroll-behavior:none}

function home(){let p=active(),c=complete(p),t=total(p);return hero(p)+'<div class="grid"><div class="panel stat"><small>Séries na semana</small><strong>'+c+'/'+t+'</strong>'+bar(c,t)+'</div><div class="panel stat"><small>Treinos completos</small><strong>'+p.days.filter((d,i)=>sum(d)>0&&count(p,i)===sum(d)).length+'/'+p.days.length+'</strong></div><div class="panel stat"><small>Sessões registradas</small><strong>'+S.logs.length+'</strong></div></div><div class="split"><section class="panel"><div class="eyebrow">Plano ativo</div><h2>'+esc(p.name)+'</h2>'+(!p.id?'<p>Crie um treino ou importe uma ficha recebida para acompanhar seu progresso.</p><div class="actions" style="margin-top:12px"><button class="btn primary" data-a="new">Criar treino</button><button class="btn" data-share="import">Importar código</button></div>':'')+p.days.map((d,i)=>'<div class="row"><div><h3>'+esc(d.name)+'</h3><small>'+esc(d.title)+'</small></div><button class="btn" data-a="day" data-v="'+i+'">'+count(p,i)+'/'+sum(d)+'</button></div>').join('')+'</section><div><section class="panel"><h2>Monte sua rotina</h2><p>Crie uma ficha manualmente ou use um modelo. Ajuste os exercícios, séries, repetições e descanso para sua rotina.</p><button class="btn primary" style="margin-top:12px" data-a="new">Criar plano</button></section><section class="panel"><h2>Precisa de ajuda?</h2><p>Converse com a IA de treino para montar uma ficha ou com a IA de nutrição para obter sugestões alimentares.</p><div class="actions" style="margin-top:10px"><button class="btn" data-a="tab" data-v="coach">IA de treino</button><button class="btn" data-a="tab" data-v="food">IA de nutrição</button></div></section><section class="panel"><h2>Recuperação</h2><p>Reserve dias de recuperação de acordo com o volume e intensidade do seu plano. RIR e técnica têm prioridade sobre a falha.</p></section></div></div><section class="panel"><h2>Histórico de sessões</h2>'+(S.logs.length?S.logs.slice().reverse().slice(0,20).map(l=>'<div class="row"><div>'+esc(l.plan)+'<br><small>'+esc(l.day)+' · '+esc(l.date)+'</small></div><strong>'+l.done+'/'+l.total+'</strong></div>').join(''):'<p>Nenhuma sessão finalizada. Registre a primeira no treino.</p>')+'</section>'}

 {re:/bicicleta|bike|ergometr/,name:'Bicicleta ergométrica',how:'Ajuste o banco para que o joelho fique levemente dobrado quando o pedal estiver embaixo. Pedale com resistência baixa, sem ficar ofegante. Aumente o ritmo aos poucos.',amount:'5 minutos leves',q:'como ajustar e usar bicicleta ergométrica academia'},
 {re:/eliptico/,name:'Elíptico',how:'Apoie os pés nas plataformas, mantenha o tronco ereto e comece devagar. Use resistência baixa e movimento contínuo, sem puxar com força os braços.',amount:'5 minutos leves',q:'como usar elíptico academia'},
 {re:/esteira|caminhada/,name:'Caminhada leve',how:'Comece em velocidade confortável, com passos naturais. Mantenha postura ereta e use inclinação baixa ou zero, sem se apoiar continuamente nas barras.',amount:'5 minutos leves',q:'como caminhar na esteira academia'},
 {re:/quadril/,name:'Mobilidade de quadril — círculos controlados',how:'Em pé, segure um apoio firme. Eleve um joelho dobrado até uma altura confortável, abra-o para o lado e retorne. Faça círculos lentos, mantendo a pelve e o tronco estáveis. Inverta o sentido na metade das repetições e troque de lado.',amount:'8 repetições por lado',q:'mobilidade quadril círculos em pé hip CARs'},
 {re:/tornozelo/,name:'Mobilidade de tornozelo — joelho na direção da parede',how:'Em pé, posicione um pé diante de uma parede. Leve o joelho para a frente na direção dos dedos, mantendo o calcanhar no chão; retorne devagar. Ajuste a distância para não sentir dor e repita do outro lado.',amount:'10 repetições por lado',q:'mobilidade tornozelo joelho na parede'},
 {re:/stiff|romeno/,name:'Stiff sem carga — dobradiça do quadril',how:'Pés na largura do quadril e joelhos levemente flexionados. Empurre o quadril para trás com a coluna neutra até sentir alongamento leve nos posteriores; volte contraindo os glúteos. Não tente tocar o chão.',amount:'10 repetições',q:'hip hinge stiff sem carga execução'},

 {re:/rotacaoexterna/,name:'Rotação externa de ombros com elástico leve',how:'Prenda o elástico em um ponto firme na altura do cotovelo. Mantenha o cotovelo ao lado do corpo, dobrado a 90°. Gire o antebraço para fora sem afastar o cotovelo nem rodar o tronco. Retorne lentamente e repita com o outro braço.',amount:'12 repetições por braço',q:'rotação externa ombro elástico cotovelo junto corpo'},
 {re:/escapular|escapula/,name:'Mobilidade escapular — protração e retração',how:'Em pé, com braços estendidos à frente, alcance as mãos para a frente afastando as escápulas; depois aproxime suavemente as escápulas sem dobrar os cotovelos. Não encolha os ombros.',amount:'10 repetições',q:'protração e retração escapular mobilidade em pé'},

 {re:/deadbug/,name:'Dead bug — braço e perna opostos',how:'Deite de costas, eleve os braços e dobre os joelhos a 90°. Estenda devagar um braço e a perna oposta sem arquear a lombar. Retorne e alterne os lados, respirando normalmente.',amount:'6 repetições por lado',q:'dead bug abdominal execução iniciante'}

function warmAmount(text,fallback){text=text.replace(/[.!?]+$/,'').trim();let m=text.match(/(\d+(?:[–-]\d+)?)\s*(?:min(?:utos?)?)/i);if(m)return m[1]+' minutos leves';m=text.match(/(\d+(?:[–-]\d+)?)\s*(?:repetições|reps)?\s*(?:\/\s*(?:lado|perna|braço)|por\s+(?:lado|perna|braço))/i);if(m)return m[1]+' repetições por lado';m=text.match(/(\d+(?:[–-]\d+)?)\s*(?:repetições|reps)?\s*$/i);if(m)return m[1]+' repetições'+(/por braço/.test(fallback)?' por braço':'');return fallback}
function warmGuide(d){const raw=String(d.warm||'5 min leves e séries preparatórias sem fadiga.').trim(),items=raw.split(/[;\n•]+/).map(t=>t.trim()).filter(Boolean);let steps=items.map(t=>{const normalized=norm(t),e=warmExamples.find(e=>e.re.test(normalized))||(/^(?:\d+)min/.test(normalized)?warmExamples[2]:null);return e?{...e,amount:warmAmount(t,e.amount),original:t}:{name:t,amount:'Conforme a ficha',how:'Faça o movimento com pouca resistência, amplitude confortável e controle. Não provoque fadiga. Se não souber qual movimento é indicado, confirme com a IA de treino ou com um profissional.',q:t+' execução aquecimento',original:t}});if(!steps.length)steps=[{...warmExamples[2],original:'Caminhada leve'}];return '<p class="explain">Prepare o corpo antes das séries principais. Faça os passos na ordem, com esforço leve, sem dor e sem chegar à falha. Os exemplos abaixo mostram como executar a preparação prescrita.</p><details class="warm-specific"><summary>Ver prescrição original do aquecimento</summary><p>'+esc(raw)+'</p></details><div class="warm-steps">'+steps.map((e,i)=>'<div class="warm-step"><div class="warm-step-top"><span class="warm-step-number">'+(i+1)+'</span><div><h4>'+esc(e.name)+'</h4><span class="warm-amount">'+esc(e.amount)+'</span></div></div><p>'+esc(e.how)+'</p><div class="warm-visual"><a class="mini" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.q)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg>Buscar vídeo do movimento</a></div></div>').join('')+'</div>'}
function warmSpecific(e){let n=Number(e.warm)||0;if(!n)return '<p class="set-explain">Sem séries preparatórias prescritas neste exercício. Se necessário, ensaie o movimento de forma leve.</p>';let reps=n===1?['8–12']:n===2?['10','5–6']:['12','8','4–5',...Array(Math.max(0,n-3)).fill('3–5')];return '<details class="warm-specific"><summary>Como fazer as '+n+' séries de aquecimento</summary><p>Use o mesmo movimento de <strong>'+esc(e.name)+'</strong>, com resistência bem menor que nas séries principais. '+esc(e.how)+'</p>'+reps.slice(0,n).map((r,i)=>'<p><strong>Aquecimento '+(i+1)+':</strong> '+r+' repetições, '+(i===0?'bem leves.':'ainda leves, sem fadiga.')+'</p>').join('')+'<p>Termine cada aquecimento conseguindo fazer pelo menos mais 4 repetições. Descanse 60 segundos entre preparatórias; antes de um exercício composto exigente, descanse 90 segundos. Não marque estas séries como séries principais.</p></details>'}
function repsLabel(e){let r=String(e.reps||'');if(/\d\s*(?:s|seg(?:undos)?|min(?:utos?)?)\b/i.test(r))return r.replace(/(\d)\s*s\b/g,'$1 segundos');return r.replace(/\/(lado|perna|braço)/g,' por $1').replace(/^(\d+(?:[–-]\d+)?)(?=\s+por\b)/,'$1 repetições').replace(/^(\d+(?:[–-]\d+)?)$/,'$1 repetições')}
function reserveFor(e,i){let parts=String(e.rir||'').split('/').map(x=>x.trim());return parts.length===e.sets?parts[i]:String(e.rir||'').trim()}
function reserveLabel(e,i){const r=reserveFor(e,i);if(/^\d+(?:[–-]\d+)?$/.test(r))return r+' em reserva';return r?'RIR '+r:''}
function terms(){return '<dl class="term-box"><dt>Série</dt><dd>Um bloco de repetições. Ex.: 3 séries de 10 significa executar 10 movimentos, descansar e repetir o bloco mais duas vezes.</dd><dt>Repetição</dt><dd>Um movimento completo, com subida e descida controladas. Quando indicado por lado, faça em ambos os lados.</dd><dt>RIR — repetições em reserva</dt><dd>Quantas repetições ainda conseguiria fazer mantendo a técnica. RIR 2 significa parar com aproximadamente 2 repetições possíveis; RIR 0 é falha técnica. Os números em sequência correspondem às séries na ordem.</dd><dt>Descanso</dt><dd>Intervalo entre séries principais. Em exercícios unilaterais, troque de lado em aproximadamente 20 segundos e conte o descanso após os dois lados.</dd><dt>Cadência</dt><dd>Tempo de cada fase do movimento: subida, descida e pausas. Ex.: descer em 3 segundos e subir em 1 segundo.</dd><dt>Drop-set e rest-pause</dt><dd>Drop-set é reduzir a resistência e continuar; rest-pause é fazer pausas curtas e continuar com a mesma resistência. Faça somente se prescritos, na série indicada.</dd></dl>'}

function train(){let p=active();if(!p.id)return '<div class="eyebrow">Treino</div><h1>Seu próximo treino</h1><section class="panel"><h2>Nenhum plano ativo</h2><p>Crie uma ficha, peça ajuda à IA ou importe um código recebido para começar. Seus treinos ficam salvos neste aparelho.</p><div class="actions" style="margin-top:12px"><button class="btn primary" data-a="new">Criar treino</button><button class="btn" data-share="import">Importar por código</button><button class="btn" data-a="tab" data-v="plans">Meus planos</button></div></section>';S.day=Math.max(0,Math.min(S.day,p.days.length-1));let d=p.days[S.day],c=count(p,S.day),t=sum(d);return '<div class="eyebrow">Treino ativo</div><div class="introhelp"><strong>Como usar durante a sessão</strong><p>Escolha o dia, faça o aquecimento e execute os exercícios na ordem. Toque em Série 1, Série 2 e assim por diante depois de completar cada bloco de repetições. O botão de descanso inicia o cronômetro. Ver execução abre as orientações. Finalizar treino registra a sessão no histórico.</p></div><h1>'+esc(p.name)+'</h1><button class="btn" style="margin-top:12px" data-share="export" data-id="'+esc(p.id)+'">Compartilhar treino</button><div class="days">'+p.days.map((v,i)=>'<button class="day '+(i===S.day?'active':'')+'" data-a="day" data-v="'+i+'">'+esc(v.name.slice(0,3))+'<small>'+count(p,i)+'/'+sum(v)+'</small></button>').join('')+'</div><div class="section"><h2>'+esc(d.title)+'</h2><small>'+c+'/'+t+' séries</small></div>'+bar(c,t)+'<div class="split"><div><section class="panel"><h3>1. Aquecimento e mobilidade</h3>'+warmGuide(d)+'<button class="mini '+(S.checks[key(p.id,S.day,'warm',0)]?'checked':'')+'" data-a="flag" data-v="warm">'+(S.checks[key(p.id,S.day,'warm',0)]?'✓ Aquecimento concluído':'Concluir aquecimento e mobilidade')+'</button></section>'+d.ex.map((e,i)=>{let done=Array.from({length:e.sets},(_,s)=>checked(p.id,S.day,i,s)).every(Boolean),k=p.id+':'+S.day+':'+i;return '<article class="ex '+(done?'finished':'')+'"><div class="exhead"><div class="thumb">'+thumb(e)+'</div><div><small>EXERCÍCIO '+(i+1)+'</small><h3>'+esc(e.name)+'</h3><div class="exercise-meta"><span>'+e.sets+' séries de '+esc(repsLabel(e))+'</span><span>· '+e.rest+' segundos de descanso</span></div></div><button class="check '+(done?'checked':'')+'" aria-label="Marcar todas as séries" data-a="all" data-v="'+i+'">'+(done?'<b>✓</b><small>Concluído</small>':'<b>○</b><small>Marcar todas</small>')+'</button></div><div class="exbody">'+warmSpecific(e)+'<div class="set-area"><strong>Séries principais</strong><p class="set-explain">Faça '+esc(repsLabel(e))+' em cada série. Toque em cada botão somente depois de terminar o bloco. Reserva = repetições que ainda conseguiria realizar.</p><div class="sets">'+Array.from({length:e.sets},(_,s)=>'<button class="set '+(checked(p.id,S.day,i,s)?'checked':'')+'" data-a="set" data-v="'+i+':'+s+'" aria-pressed="'+checked(p.id,S.day,i,s)+'" aria-label="Série '+(s+1)+'">'+(checked(p.id,S.day,i,s)?'✓ Série ':'Série ')+(s+1)+'<span class="set-rir">'+esc(reserveLabel(e,s))+'</span><span class="set-status">'+(checked(p.id,S.day,i,s)?'Concluída':'Marcar ao terminar')+'</span></button>').join('')+'</div></div><div class="actions"><button class="btn primary" data-a="timer" data-v="'+e.rest+'">Iniciar descanso ('+e.rest+' s)</button><button class="btn" data-a="detail" data-v="'+esc(k)+'">'+(open.has(k)?'Ocultar instruções':'Ver execução')+'</button></div>'+(e.special?'<div class="tech">'+esc(e.special)+'</div>':'')+'</div>'+(open.has(k)?'<div class="details">'+details(e)+'</div>':'')+'</article>'}).join('')+'</div><aside><section class="panel"><h3>Cardio</h3><p>'+esc(d.cardio||'Opcional: caminhada leve, conforme recuperação.')+'</p><button class="mini '+(S.checks[key(p.id,S.day,'cardio',0)]?'checked':'')+'" data-a="flag" data-v="cardio">Marcar cardio</button></section><section class="panel"><h3>Notas e cargas</h3><p class="explain">Registre pesos usados, dificuldades ou observações. São privadas neste navegador e não acompanham o código de compartilhamento.</p><textarea id="notes" placeholder="Anote as cargas, sensações e repetições…">'+esc(S.notes[p.id+':'+S.day]||'')+'</textarea></section><section class="panel"><h3>Concluir sessão</h3><p>Salva o número de séries realizadas hoje. Você também pode registrar um treino parcial. As marcações da semana continuam visíveis.</p><button class="btn primary" data-a="finish" style="margin-top:10px">Finalizar treino</button></section><section class="panel"><h3>Entenda os termos da ficha</h3>'+terms()+'</section></aside></div>'}
function plans(){return '<div class="eyebrow">Planejamento</div><div class="introhelp"><strong>O que são planos?</strong><p>Um plano reúne os dias de treino da semana. Escolha Usar para torná-lo ativo, Editar para alterar sua rotina, Duplicar para criar uma cópia ou Compartilhar para enviar a ficha a alguém.</p></div><div class="section"><h1>Meus planos</h1><button class="btn primary" data-a="new">Novo plano</button></div><section class="panel"><h2>Recebeu um treino?</h2><p>Cole um código para conferir a ficha e salvar sua própria cópia.</p><button class="btn" data-share="import" style="margin-top:10px">Importar por código</button></section>'+(!S.plans.length?'<section class="panel"><h2>Seus planos aparecem aqui</h2><p>Você ainda não tem fichas. Crie uma rotina ou importe um código compartilhado.</p></section>':'')+S.plans.map(p=>'<section class="panel"><div class="row"><div><h3>'+esc(p.name)+'</h3><small>'+p.days.length+' dias · '+total(p)+' séries</small></div>'+(S.plan===p.id?'<span class="tag">Ativo</span>':'')+'</div><div class="actions"><button class="btn primary" data-a="activate" data-v="'+p.id+'">Usar</button><button class="btn" data-a="edit" data-v="'+p.id+'">Editar</button><button class="btn" data-a="clone" data-v="'+p.id+'">Duplicar</button><button class="btn" data-share="export" data-id="'+esc(p.id)+'">Compartilhar</button><button class="btn danger" data-a="delete" data-v="'+p.id+'">Excluir</button></div></section>').join('')+(draft?builder():'')}
function builder(){return '<section class="panel" id="builder"><h2>Editor de plano</h2><p class="explain">Organize a semana em dias. Adicione exercícios da biblioteca e ajuste séries (quantas vezes repetir o bloco), repetições (movimentos dentro da série), descanso e RIR (repetições que ainda conseguiria fazer). Ao salvar, a ficha aparece em Meus planos.</p><label class="label" for="pname">Nome</label><input id="pname" value="'+esc(draft.name)+'"><div class="formgrid"><div><label class="label">Modelo</label><select id="model"><option value="casa">Calistenia</option><option value="academia">Academia</option></select></div><div><label class="label">Dias por semana</label><select id="freq"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></div><button class="btn" data-a="generate" style="margin-top:10px">Gerar modelo introdutório</button><p class="note" style="margin-top:10px">Sugestões conservadoras, sem técnicas intensificadoras. Ajuste conforme experiência. Criação manual disponível abaixo.</p>'+draft.days.map((d,i)=>'<div class="panel"><label class="label">Dia '+(i+1)+'</label><input data-field="daytitle" data-i="'+i+'" value="'+esc(d.title)+'"><label class="label">Aquecimento</label><input data-field="warm" data-i="'+i+'" value="'+esc(d.warm||'')+'"><label class="label">Cardio / complemento</label><input data-field="cardio" data-i="'+i+'" value="'+esc(d.cardio||'')+'">'+d.ex.map((e,j)=>'<div class="panel"><h3>'+esc(e.name)+'</h3><div class="formgrid"><div><label class="label">Séries principais</label><input type="number" min="1" max="10" data-field="sets" data-i="'+i+'" data-j="'+j+'" value="'+e.sets+'"></div><div><label class="label">Repetições ou tempo</label><input data-field="reps" data-i="'+i+'" data-j="'+j+'" value="'+esc(e.reps)+'"></div><div><label class="label">Descanso (s)</label><input type="number" min="15" max="600" data-field="rest" data-i="'+i+'" data-j="'+j+'" value="'+e.rest+'"></div><div><label class async function encodePlan(p){const payload=sharePayload(p);unpack(payload);let bytes=new TextEncoder().encode(JSON.stringify(payload));if(bytes.length>PAYLOAD_MAX)throw Error('Ficha grande demais para compartilhamento.');let tag='T';if(typeof CompressionStream==='function'){try{let zipped=await readBounded(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')),PAYLOAD_MAX);if(zipped.length<bytes.length){tag='G';bytes=zipped}}catch{}}const code='FORMA1-'+tag+'-'+b64url(bytes);if(code.length>SHARE_MAX)throw Error('Código grande demais. Reduza o tamanho da ficha.');return code}
function extractCode(input){let t=input.trim();if(t.startsWith('https://')||t.startsWith('http://')){let u=new URL(t);if(!u.hash.startsWith('#treino='))throw Error('Link sem código de treino.');t=decodeURIComponent(u.hash.slice(8))}return t.replace(/\s/g,'')}
async function decodePlan(input){if(typeof input!=='string'||input.length>SHARE_MAX*2)throw Error('Código muito longo.');const code=extractCode(input);if(code.length>SHARE_MAX)throw Error('Código muito longo.');const m=/^FORMA1-([TG])-([A-Za-z0-9_-]+)$/.exec(code);if(!m)throw Error('Código inválido ou incompatível. Confira se foi copiado por inteiro.');let bytes=from64(m[2]);if(m[1]==='G'){if(typeof DecompressionStream!=='function')throw Error('Este navegador não lê códigos compactados. Use um navegador atualizado.');bytes=await readBounded(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),PAYLOAD_MAX)}if(bytes.length>PAYLOAD_MAX)throw Error('Ficha grande demais.');return unpack(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)))}
function shareLink(code){let u=new URL(location.href);u.search='';u.hash='treino='+encodeURIComponent(code);return u.href}
function showShare(){if(!shareDialog.open)shareDialog.showModal()}
function closeShare(){shareGeneration++;importedPlan=null;sharedCode='';if(shareDialog.open)shareDialog.close()}
async function openExport(id){const p=planForShare(id);if(!p)return;let g=++shareGeneration;importedPlan=null;sharedCode='';$('shareHeading').textContent='Compartilhar treino';shareContent.innerHTML='<p>Gerando código…</p>';showShare();try{let code=await encodePlan(p);if(g!==shareGeneration)return;sharedCode=code;shareContent.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+p.days.length+' dias · '+total(p)+' séries. O código contém somente a ficha; histórico, cargas, notas e alimentação não são enviados.</p><label class="label" for="shareCode">Código de compartilhamento</label><textarea readonly id="shareCode">'+esc(code)+'</textarea><div class="actions"><button class="btn primary" data-share="copy-code">Copiar código</button><button class="btn" data-share="copy-link">Copiar link</button></div>'+(typeof navigator.share==='function'?'<button class="btn" style="width:100%;margin-top:8px" data-share="native">Enviar para outra pessoa</button>':'')+'<p class="note">Quem receber pode colar o código em Planos → Importar por código, ou abrir o link. A cópia é independente e não recebe futuras alterações.</p><p id="shareStatus" role="status"></p>'}catch(e){if(g===shareGeneration)shareContent.innerHTML='<p role="alert">'+esc(e.message)+'</p>'}}
function openImport(input=''){shareGeneration++;sharedCode='';importedPlan=null;$('shareHeading').textContent='Importar treino';shareContent.innerHTML='<p>Cole o código ou link enviado por outra pessoa. Você poderá revisar os dias antes de salvar.</p><label class="label" for="importCode">Código ou link</label><textarea id="importCode" maxlength="200000" placeholder="FORMA1-…">'+esc(input)+'</textarea><button class="btn primary" data-share="preview" style="width:100%;margin-top:10px">Conferir ficha</button><div id="importPreview"></div><p id="shareStatus" role="alert"></p>';showShare();if(input)previewImport()}
async function previewImport(){let el=$('importCode');if(!el)return;const g=++shareGeneration;importedPlan=null;$('importPreview').innerHTML='';$('shareStatus').textContent='Conferindo…';try{let p=await decodePlan(el.value);if(g!==shareGeneration)return;importedPlan=p;$('shareStatus').textContent='';$('importPreview').innerHTML='<div class="preview"><h3>'+esc(p.name)+'</h3><p>'+p.days.length+' dias · '+total(p)+' séries · '+p.days.reduce((n,d)=>n+d.ex.length,0)+' exercícios.</p>'+p.days.map(d=>'<details class="row" style="display:block"><summary>'+esc(d.name)+' — '+esc(d.title)+' · '+sum(d)+' séries</summary><p>'+d.ex.map(e=>esc(e.name)+' — '+e.sets+' × '+esc(e.reps)+(e.special?' · técnica especial':'')).join('<br>')+'</p></details>').join('')+'<p class="note">Confira se a intensidade e as técnicas são adequadas para você. A ficha será salva como uma nova cópia, sem substituir seus planos.</p><button class="btn primary" style="width:100%" data-share="confirm-import">Salvar e usar treino</button></div>'}catch(e){if(g===shareGeneration)$('shareStatus').textContent=e instanceof SyntaxError?'Código inválido ou incompleto.':e.message||'Não foi possível importar o treino.'}}
async function copyShare(textValue){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(textValue);return true}}catch{}const tmp=document.createElement('textarea');tmp.value=textValue;tmp.style.cssText='position:fixed;opacity:0;left:0;top:0';shareDialog.append(tmp);tmp.select();let ok=false;try{ok=document.execCommand('copy')}catch{}tmp.remove();return ok}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-share]');if(!b)return;const a=b.dataset.share;if(a==='close')return closeShare();if(a==='export')return openExport(b.dataset.id);if(a==='import')return openImport();if(a==='preview')return previewImport();if(a==='confirm-import'&&importedPlan){const p={...copy(importedPlan),id:uid()};S.plans.push(p);S.plan=p.id;S.day=0;S.tab='train';closeShare();if(location.hash.startsWith('#treino='))history.replaceState(null,'',location.pathname+location.search);render(false);return}if((a==='copy-code'||a==='copy-link')&&sharedCode){let ok=await copyShare(a==='copy-code'?sharedCode:shareLink(sharedCode));if($('shareStatus'))$('shareStatus').textContent=ok?'Copiado!':'Não foi possível copiar automaticamente. Selecione o código e copie manualmente.'}if(a==='native'&&sharedCode){try{await navigator.share({title:'Treino Forma',text:'Importe minha ficha no Forma.',url:shareLink(sharedCode)})}catch(e){if(e.name!=='AbortError'&&$('shareStatus'))$('shareStatus').textContent='Não foi possível abrir o compartilhamento. Use Copiar link.'}}});
shareDialog.addEventListener('close',()=>{shareGeneration++;importedPlan=null;sharedCode=''});
document.addEventListener('input',ev=>{if(ev.target.id==='importCode'){shareGeneration++;importedPlan=null;$('importPreview').innerHTML='';$('shareStatus').textContent=''}});
function openSharedHash(){if(location.hash.startsWith('#treino=')){try{openImport(decodeURIComponent(location.hash.slice(8)))}catch{openImport()}}}
window.addEventListener('hashchange',openSharedHash);

if(!S.plans.some(p=>p.id===S.plan)){S.plan=null;S.day=0}render(false);openSharedHash();fetch(base+'dist/exercises.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{if(Array.isArray(x)){media=x;if(!draft&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT')render()}}).catch(()=>{});
</script></body></html>
