function tick(){if(!paused)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=left?String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'):'Concluído';if(!left){clearInterval(timerId);navigator.vibrate?.(150)}}function start(sec){clearInterval(timerId);left=sec;paused=false;deadline=Date.now()+sec*1000;$('timer').classList.add('show');$('pause').textContent='Pausar';tick();timerId=setInterval(tick,250)}
$('pause').onclick=()=>{if(!left)return;if(paused){deadline=Date.now()+left*1000;paused=false}else{tick();paused=true}$('pause').textContent=paused?'Retomar':'Pausar'};$('plus').onclick=()=>{left+=15;deadline=Date.now()+left*1000;clearInterval(timerId);timerId=setInterval(tick,250);tick()};$('end').onclick=()=>{clearInterval(timerId);$('timer').classList.remove('show')};
document.addEventListener('input',e=>{let t=e.target;if(t.id==='notes'){S.notes[active().id+':'+S.day]=t.value;save()}if(t.id==='filter'){filter=t.value;$('lib').innerHTML=libitems()}if(t.id==='pname'&&draft)draft.name=t.value;if(t.dataset.field&&draft){let d=draft.days[+t.dataset.i],f=t.dataset.field;if(f==='daytitle')d.title=t.value;else if(t.dataset.j===undefined)d[f]=t.value;else{let x=d.ex[+t.dataset.j];x[f]=['sets','rest'].includes(f)?+t.value:t.value}}});document.addEventListener('change',e=>{if(e.target.id==='kind'){kind=e.target.value;$('lib').innerHTML=libitems()}});
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,v=b.dataset.v,p=active(),d=p.days[S.day],i,j; if(a==='tab'){S.tab=v;render(false);return}if(a==='timer'){start(+v);return}if(a==='motion'){b.closest('.details')?.querySelector('.media')?.classList.toggle('paused');return}if(a==='day'){S.day=+v;S.tab='train';render(false);return}if(a==='set'){[i,j]=v.split(':').map(Number);let k=key(p.id,S.day,i,j);S.checks[k]=!S.checks[k]}else if(a==='all'){i=+v;let yes=d.ex[i].sets===Array.from({length:d.ex[i].sets},(_,s)=>checked(p.id,S.day,i,s)).filter(Boolean).length;for(let s=0;s<d.ex[i].sets;s++)S.checks[key(p.id,S.day,i,s)]=!yes}else if(a==='flag'){let k=key(p.id,S.day,v,0);S.checks[k]=!S.checks[k]}else if(a==='detail'){open.has(v)?open.delete(v):open.add(v)}else if(a==='finish'){let l={plan:p.name,day:d.name,date:date(),done:count(p,S.day),total:sum(d),id:p.id+':'+S.day+':'+date()};if(l.done<l.total&&!confirm('Registrar sessão parcial?'))return;S.logs=S.logs.filter(x=>x.id!==l.id);S.logs.push(l);S.tab='home';render(false);return}else if(a==='new'){draft={id:uid(),name:'Meu treino',days:[emptyday(0)]};S.tab='plans';render();$('builder').scrollIntoView();return}else if(a==='activate'){S.plan=v;S.day=0;S.tab='train';render(false);return}else if(a==='edit'||a==='clone'){let x=v==='original'?{id:'original',name:'Especialização feminina avançada',days:D}:S.plans.find(x=>x.id===v);draft=copy(x);if(a==='clone'){draft.id=uid();draft.name+=' — cópia'}S.tab='plans';render();$('builder').scrollIntoView();return}else if(a==='delete'){if(!confirm('Excluir este plano?'))return;S.plans=S.plans.filter(x=>x.id!==v);if(S.plan===v){S.plan='original';S.day=0}}else if(a==='generate'){let n=+$('freq').value,mode=$('model').value,sets=mode==='casa'?[[34,35,36,37,41],[40,34,38,42,39]]:[[14,6,8,3,13],[1,15,7,9,5]];draft.days=Array.from({length:n},(_,k)=>({...emptyday(k),title:(mode==='casa'?'Calistenia':'Academia')+' '+(k+1),ex:sets[k%2].map(id=>({...copy(E[id]),sets:2,rir:'3',special:''}))}))}else if(a==='addday'){if(draft.days.length<7)draft.days.push(emptyday(draft.days.length))}else if(a==='removeday'){if(draft.days.length>1)draft.days.splice(+v,1)}else if(a==='add'){let e=copy(E[+$('add'+v).value]);e.special='';e.rir='3';draft.days[+v].ex.push(e)}else if(['remove','up','down'].includes(a)){[i,j]=v.split(':').map(Number);let ex=draft.days[i].ex;if(a==='remove')ex.splice(j,1);else{let k=j+(a==='up'?-1:1);if(k>=0&&k<ex.length)[ex[j],ex[k]]=[ex[k],ex[j]]}}else if(a==='saveplan'){if(!draft.name.trim()||draft.days.some(d=>!d.title.trim()||!d.ex.length||d.ex.some(e=>!Number.isInteger(e.sets)||e.sets<1||e.sets>10||!e.reps.trim()||!Number.isFinite(e.rest)||e.rest<15||e.rest>600))){alert('Preencha nome e exercícios válidos em todos os dias (1–10 séries, descanso de 15–600s).');return}S.plans=S.plans.filter(p=>p.id!==draft.id);S.plans.push(copy(draft));S.checks=Object.fromEntries(Object.entries(S.checks).filter(([k])=>!k.includes(':'+draft.id+':')));draft=null}else if(a==='cancel')draft=null;else if(a==='libdetail'){detail=+v;$('lib').innerHTML=libitems();$('libdetail').scrollIntoView();return}else if(a==='closelib'){detail=null;$('lib').innerHTML=libitems();return}else if(a==='meal'){let t=$('mealtext').value.trim();if(!t)return;S.meals.push({date:date(),type:$('mealtype').value,text:t})}else if(a==='delmeal'){S.meals.splice(+v,1)}else if(a==='ask'||a==='send'){let q=(a==='ask'?v:$('question').value).trim();if(!q)return;let f=S.tab==='food',m=f?'nutri':'treino';S.chat[m].push({user:true,text:q},{user:false,text:answer(q,f)})}render()});

/* FORMA Share v1 — public plan data only; no user/session data. */
const shareDialog=$('shareDialog'), shareContent=$('shareContent');
let sharedCode='', importedPlan=null, shareGeneration=0;
const SHARE_MAX=100000, PAYLOAD_MAX=180000;
const fields=['id','sets','reps','rest','rir','warm','special'];
function planForShare(id){return id==='original'?{id:'original',name:'Especialização feminina avançada',days:D}:S.plans.find(p=>p.id===id)}
function sharePayload(p){return [1,p.name,p.days.map(d=>[d.name,d.title,d.warm||'',d.cardio||'',d.ex.map(e=>fields.map(f=>e[f]??''))])]}
function b64url(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function from64(s){if(!/^[A-Za-z0-9_-]+$/.test(s))throw Error('Código inválido.');return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))}
async function readBounded(stream,limit){const reader=stream.getReader(),chunks=[];let n=0;try{for(;;){let {done,value}=await reader.read();if(done)break;n+=value.length;if(n>limit){await reader.cancel();throw Error('Ficha grande demais.')}chunks.push(value)}}finally{reader.releaseLock()}let out=new Uint8Array(n),i=0;for(let c of chunks){out.set(c,i);i+=c.length}return out}
function validText(x,max,required=false){if(typeof x!=='string'||x.length>max||(required&&!x.trim()))throw Error('A ficha contém campos inválidos ou muito longos.');return x}
function validInt(x,min,max){if(!Number.isInteger(x)||x<min||x>max)throw Error('A ficha contém séries, descansos ou exercícios inválidos.');return x}
function unpack(a){if(!Array.isArray(a)||a.length!==3||a[0]!==1||!Array.isArray(a[2])||a[2].length<1||a[2].length>7)throw Error('Formato de treino incompatível.');return {name:validText(a[1],120,true),days:a[2].map(d=>{if(!Array.isArray(d)||d.length!==5||!Array.isArray(d[4])||!d[4].length||d[4].length>40)throw Error('Dia de treino inválido.');return {name:validText(d[0],60,true),title:validText(d[1],160,true),warm:validText(d[2],2000),cardio:validText(d[3],2000),ex:d[4].map(e=>{if(!Array.isArray(e)||e.length!==7)throw Error('Exercício inválido.');const id=validInt(e[0],0,E.length-1);return {...copy(E[id]),sets:validInt(e[1],1,10),reps:validText(e[2],80,true),rest:validInt(e[3],15,600),rir:validText(e[4],80,true),warm:validInt(e[5],0,10),special:validText(e[6],3000)}})}})}}
async function encodePlan(p){if(p.id==='original')return 'FORMA1-ORIGINAL';const payload=sharePayload(p);unpack(payload);let bytes=new TextEncoder().encode(JSON.stringify(payload));if(bytes.length>PAYLOAD_MAX)throw Error('Ficha grande demais para compartilhamento.');let tag='T';if(typeof CompressionStream==='function'){try{let zipped=await readBounded(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')),PAYLOAD_MAX);if(zipped.length<bytes.length){tag='G';bytes=zipped}}catch{}}const code='FORMA1-'+tag+'-'+b64url(bytes);if(code.length>SHARE_MAX)throw Error('Código grande demais. Reduza o tamanho da ficha.');return code}
function extractCode(input){let t=input.trim();if(t.startsWith('https://')||t.startsWith('http://')){let u=new URL(t);if(!u.hash.startsWith('#treino='))throw Error('Link sem código de treino.');t=decodeURIComponent(u.hash.slice(8))}return t.replace(/\s/g,'')}
async function decodePlan(input){if(typeof input!=='string'||input.length>SHARE_MAX*2)throw Error('Código muito longo.');const code=extractCode(input);if(code==='FORMA1-ORIGINAL')return unpack(sharePayload(planForShare('original')));if(code.length>SHARE_MAX)throw Error('Código muito longo.');const m=/^FORMA1-([TG])-([A-Za-z0-9_-]+)$/.exec(code);if(!m)throw Error('Código inválido ou incompatível. Confira se foi copiado por inteiro.');let bytes=from64(m[2]);if(m[1]==='G'){if(typeof DecompressionStream!=='function')throw Error('Este navegador não lê códigos compactados. Use um navegador atualizado.');bytes=await readBounded(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),PAYLOAD_MAX)}if(bytes.length>PAYLOAD_MAX)throw Error('Ficha grande demais.');return unpack(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)))}
function shareLink(code){let u=new URL(location.href);u.search='';u.hash='treino='+encodeURIComponent(code);return u.href}
function showShare(){if(!shareDialog.open)shareDialog.showModal()}
function closeShare(){shareGeneration++;importedPlan=null;sharedCode='';if(shareDialog.open)shareDialog.close()}
async function openExport(id){const p=planForShare(id);if(!p)return;let g=++shareGeneration;importedPlan=null;sharedCode='';$('shareHeading').textContent='Compartilhar treino';shareContent.innerHTML='<p>Gerando código…</p>';showShare();try{let code=await encodePlan(p);if(g!==shareGeneration)return;sharedCode=code;shareContent.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+p.days.length+' dias · '+total(p)+' séries. O código contém somente a ficha; histórico, cargas, notas e alimentação não são enviados.</p><label class="label" for="shareCode">Código de compartilhamento</label><textarea readonly id="shareCode">'+esc(code)+'</textarea><div class="actions"><button class="btn primary" data-share="copy-code">Copiar código</button><button class="btn" data-share="copy-link">Copiar link</button></div>'+(typeof navigator.share==='function'?'<button class="btn" style="width:100%;margin-top:8px" data-share="native">Enviar para outra pessoa</button>':'')+'<p class="note">Quem receber pode colar o código em Planos → Importar por código, ou abrir o link. A cópia é independente e não recebe futuras alterações.</p><p id="shareStatus" role="status"></p>'}catch(e){if(g===shareGeneration)shareContent.innerHTML='<p role="alert">'+esc(e.message)+'</p>'}}
function openImport(input=''){shareGeneration++;sharedCode='';importedPlan=null;$('shareHeading').textContent='Importar treino';shareContent.innerHTML='<p>Cole o código ou link enviado por outra pessoa. Você poderá revisar os dias antes de salvar.</p><label class="label" for="importCode">Código ou link</label><textarea id="importCode" maxlength="200000" placeholder="FORMA1-…">'+esc(input)+'</textarea><button class="btn primary" data-share="preview" style="width:100%;margin-top:10px">Conferir ficha</button><div id="importPreview"></div><p id="shareStatus" role="alert"></p>';showShare();if(input)previewImport()}
async function previewImport(){let el=$('importCode');if(!el)return;const g=++shareGeneration;importedPlan=null;$('importPreview').innerHTML='';$('shareStatus').textContent='Conferindo…';try{let p=await decodePlan(el.value);if(g!==shareGeneration)return;importedPlan=p;$('shareStatus').textContent='';$('importPreview').innerHTML='<div class="preview"><h3>'+esc(p.name)+'</h3><p>'+p.days.length+' dias · '+total(p)+' séries · '+p.days.reduce((n,d)=>n+d.ex.length,0)+' exercícios.</p>'+p.days.map(d=>'<details class="row" style="display:block"><summary>'+esc(d.name)+' — '+esc(d.title)+' · '+sum(d)+' séries</summary><p>'+d.ex.map(e=>esc(e.name)+' — '+e.sets+' × '+esc(e.reps)+(e.special?' · técnica especial':'')).join('<br>')+'</p></details>').join('')+'<p class="note">Confira se a intensidade e as técnicas são adequadas para você. A ficha será salva como uma nova cópia, sem substituir seus planos.</p><button class="btn primary" style="width:100%" data-share="confirm-import">Salvar e usar treino</button></div>'}catch(e){if(g===shareGeneration)$('shareStatus').textContent=e instanceof SyntaxError?'Código inválido ou incompleto.':e.message||'Não foi possível importar o treino.'}}
async function copyShare(textValue){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(textValue);return true}}catch{}const tmp=document.createElement('textarea');tmp.value=textValue;tmp.style.cssText='position:fixed;opacity:0;left:0;top:0';shareDialog.append(tmp);tmp.select();let ok=false;try{ok=document.execCommand('copy')}catch{}tmp.remove();return ok}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-share]');if(!b)return;const a=b.dataset.share;if(a==='close')return closeShare();if(a==='export')return openExport(b.dataset.id);if(a==='import')return openImport();if(a==='preview')return previewImport();if(a==='confirm-import'&&importedPlan){const p={...copy(importedPlan),id:uid()};S.plans.push(p);S.plan=p.id;S.day=0;S.tab='train';closeShare();if(location.hash.startsWith('#treino='))history.replaceState(null,'',location.pathname+location.search);render(false);return}if((a==='copy-code'||a==='copy-link')&&sharedCode){let ok=await copyShare(a==='copy-code'?sharedCode:shareLink(sharedCode));if($('shareStatus'))$('shareStatus').textContent=ok?'Copiado!':'Não foi possível copiar automaticamente. Selecione o código e copie manualmente.'}if(a==='native'&&sharedCode){try{await navigator.share({title:'Treino Forma',text:'Importe minha ficha no Forma.',url:shareLink(sharedCode)})}catch(e){if(e.name!=='AbortError'&&$('shareStatus'))$('shareStatus').textContent='Não foi possível abrir o compartilhamento. Use Copiar link.'}}});
shareDialog.addEventListener('close',()=>{shareGeneration++;importedPlan=null;sharedCode=''});
document.addEventListener('input',ev=>{if(ev.target.id==='importCode'){shareGeneration++;importedPlan=null;$('importPreview').innerHTML='';$('shareStatus').textContent=''}});
function openSharedHash(){if(location.hash.startsWith('#treino=')){try{openImport(decodeURIComponent(location.hash.slice(8)))}catch{openImport()}}}
window.addEventListener('hashchange',openSharedHash);

render(false);openSharedHash();fetch(base+'dist/exercises.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{if(Array.isArray(x)){media=x;if(!draft&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT')render()}}).catch(()=>{});
</script></body></html>
